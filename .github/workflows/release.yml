name: Release APK

# Builds a signed release APK.
#  - Push a tag like `v1.0.3`  -> builds and attaches the APK to a GitHub Release for that tag.
#  - Run manually (Actions tab -> Release APK -> Run workflow) -> builds and uploads the APK
#    as a workflow artifact only.
#
# Signing uses the debug-style keystore committed at keystore/debug.keystore (personal use only;
# the key is public). To make CI builds update over builds from your Mac, replace that file with
# your own ~/.android/debug.keystore.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx AAR
        run: ./scripts/fetch-sherpa-onnx-aar.sh

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PSIMPLETYPE_STORE_FILE="$GITHUB_WORKSPACE/keystore/debug.keystore" \
            -PSIMPLETYPE_STORE_PASSWORD=android \
            -PSIMPLETYPE_KEY_ALIAS=androiddebugkey \
            -PSIMPLETYPE_KEY_PASSWORD=android

      - name: Name APK
        id: apk
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ver="$GITHUB_REF_NAME"
          else
            ver="$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          fi
          out="SimpleType-${ver}.apk"
          cp app/build/outputs/apk/release/SimpleType-release.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
